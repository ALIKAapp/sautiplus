<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SautiPlus AI: sauti halisi ya Kiswahili kwa maandishi yako</title>
<meta name="description" content="Andika maneno, chagua sauti, pakua MP3. SautiPlus AI inatengeneza voice over za Kiswahili na Kiingereza kwa video, matangazo na biashara yako.">
<meta name="theme-color" content="#1B1B1C">
<meta property="og:title" content="SautiPlus AI">
<meta property="og:description" content="Sauti halisi ya Kiswahili na Kiingereza kwa maandishi yako. Pakua app ya Android.">
<meta property="og:image" content="https://alikaapp.github.io/sautiplus/assets/hero.jpg">
<meta property="og:type" content="website">
<link rel="icon" href="assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<link rel="preload" as="image" href="assets/hero.jpg">
<style>
:root{
  --ink:#1B1B1C; --coal:#121213; --raise:#262627; --paper:#F4F3EF; --sand:#E7E4DB; --gold:#E8C055; --gold-deep:#8A6A12;
  --mute:#A9A69D; --mute-ink:#5F5C55; --line:rgba(244,243,239,.14); --line-ink:rgba(27,27,28,.14);
  --display:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --pad:clamp(20px,5vw,64px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,video{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.04;letter-spacing:-.025em;margin:0;text-wrap:balance}
h2{font-size:clamp(34px,5.4vw,68px)}
h3{font-size:clamp(21px,2.2vw,26px);letter-spacing:-.015em;line-height:1.2}
p{margin:0;text-wrap:pretty}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:var(--pad)}
.lede{font-size:clamp(17px,1.5vw,20px);color:var(--mute);max-width:56ch}
.on-paper .lede{color:var(--mute-ink)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 26px;border-radius:999px;font-weight:700;font-size:16px;text-decoration:none;transition:transform .2s var(--ease),background-color .2s,color .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-gold{background:var(--gold);color:var(--ink)}
.btn-gold:hover{background:#F2D277}
.btn-line{border:1.5px solid var(--line);color:var(--paper)}
.btn-line:hover{background:rgba(244,243,239,.08)}
.btn-ink{background:var(--ink);color:var(--paper)}
.btn-ink:hover{background:#000}
.btn svg{flex:none}

/* Nav */
.nav{position:fixed;inset:0 0 auto 0;z-index:50;transition:background-color .3s,backdrop-filter .3s,border-color .3s;border-bottom:1px solid transparent}
.nav.stuck{background:rgba(27,27,28,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--line)}
.nav-in{display:flex;align-items:center;gap:20px;height:72px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.02em;text-decoration:none;margin-right:auto}
.brand svg{width:30px;height:30px}
.nav-links{display:flex;gap:28px;font-size:15px;font-weight:600}
.nav-links a{text-decoration:none;color:var(--mute);transition:color .2s}
.nav-links a:hover{color:var(--paper)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;font-size:13px;font-weight:700}
.lang button{padding:6px 11px;border-radius:999px;color:var(--mute)}
.lang button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.nav .btn{min-height:42px;padding:0 18px;font-size:14px}
@media (max-width:860px){.nav-links{display:none}}
@media (max-width:480px){.nav .btn span{display:none}.nav .btn{padding:0 13px}.nav-in{gap:10px}}

/* Hero */
.hero{position:relative;min-height:min(100svh,1000px);display:flex;align-items:flex-end;padding:120px 0 clamp(36px,6vh,72px);isolation:isolate;overflow:hidden}
.hero-media{position:absolute;inset:0;z-index:-2;background:#0e0e0f url(assets/hero.jpg) center/cover}
.hero-media video{width:100%;height:100%;object-fit:cover;object-position:60% 30%}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(18,18,19,.55) 0%,rgba(18,18,19,.2) 34%,rgba(18,18,19,.88) 78%,var(--ink) 100%),linear-gradient(90deg,rgba(18,18,19,.7),rgba(18,18,19,0) 62%)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(24px,3vw,40px) clamp(28px,5vw,72px);align-items:end}
.hero h1{grid-column:1/-1}
.hero h1{font-size:clamp(42px,7vw,104px);line-height:.96;letter-spacing:-.04em}
.hero h1 .ln{display:block;overflow:hidden;padding-bottom:.08em}
.hero h1 .ln>span{display:block}
.hero .lede{color:#D9D6CD}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.hero-note{margin-top:16px;font-size:14px;color:var(--mute)}

/* Hero demo: script -> voice */
.demo{background:rgba(27,27,28,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:26px;padding:20px}
.demo-script{font-size:18px;line-height:1.5;font-weight:500;min-height:3em}
.demo-script .caret{display:inline-block;width:2px;height:1.1em;background:var(--gold);vertical-align:-.18em;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.demo-row{display:flex;align-items:center;gap:14px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.play{flex:none;width:54px;height:54px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;transition:transform .2s var(--ease)}
.play:hover{transform:scale(1.06)}
.play:active{transform:scale(.94)}
.play .i-stop,.play.playing .i-play{display:none}
.play.playing .i-stop{display:block}
.bars{flex:1;min-width:0;height:54px;display:flex;align-items:center;gap:3px}
.bars i{flex:1;min-width:2px;max-width:6px;height:calc(var(--h,.2)*100%);min-height:4px;border-radius:3px;background:rgba(244,243,239,.3);transition:height .09s linear,background-color .2s}
.bars.live i{background:var(--gold)}
.demo-who{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;color:var(--mute)}
.demo-who img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.demo-who b{color:var(--paper);font-weight:700}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr}.hero{align-items:flex-end}}

/* Ticker */
.ticker{border-block:1px solid var(--line);overflow:hidden;padding:18px 0;background:var(--coal)}
.ticker-track{display:flex;gap:48px;width:max-content;animation:slide 38s linear infinite;font-family:var(--display);font-weight:600;font-size:clamp(18px,2vw,24px);color:var(--mute);white-space:nowrap}
.ticker-track span{display:inline-flex;align-items:center;gap:48px}
.ticker-track span::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold)}
@keyframes slide{to{transform:translateX(-50%)}}

/* Sections */
.sec{padding:clamp(72px,11vw,150px) 0}
.on-paper{background:var(--paper);color:var(--ink)}
.sec-head{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(20px,4vw,64px);align-items:end;margin-bottom:clamp(36px,5vw,64px)}
@media (max-width:820px){.sec-head{grid-template-columns:1fr}}

/* Voices */
.tabs{display:inline-flex;background:var(--sand);border-radius:999px;padding:4px;margin-bottom:26px}
.tabs button{padding:10px 22px;border-radius:999px;font-weight:700;font-size:15px;color:var(--mute-ink);transition:background-color .2s,color .2s}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.voices{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.voice{display:flex;align-items:center;gap:14px;padding:14px 16px 14px 14px;border-radius:22px;background:#fff;border:1px solid var(--line-ink);text-align:left;width:100%;transition:transform .25s var(--ease),border-color .2s,background-color .2s}
.voice:hover{transform:translateY(-3px);border-color:rgba(27,27,28,.4)}
.voice.playing{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.voice img{width:62px;height:62px;border-radius:50%;object-fit:cover;flex:none}
.voice-txt{flex:1;min-width:0}
.voice-txt b{display:block;font-family:var(--display);font-size:19px;letter-spacing:-.01em;line-height:1.2}
.voice-txt span{display:block;font-size:13.5px;color:var(--mute-ink);line-height:1.35;margin-top:2px}
.voice.playing .voice-txt span{color:var(--mute)}
.voice .pp{flex:none;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line-ink);display:grid;place-items:center;transition:background-color .2s,border-color .2s,color .2s}
.voice .pp .i-stop{display:none}
.voice.playing .pp{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.voice.playing .pp .i-play{display:none}
.voice.playing .pp .i-stop{display:block}
.voices[hidden]{display:none}
.voices-foot{margin-top:22px;font-size:14.5px;color:var(--mute-ink)}

/* Steps */
.steps{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(28px,6vw,96px);align-items:start}
.steps-media{position:sticky;top:104px;border-radius:28px;overflow:hidden;aspect-ratio:4/5;background:#0e0e0f url(assets/studio.jpg) center/cover}
.steps-media video{width:100%;height:100%;object-fit:cover}
.step{padding:30px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:64px 1fr;gap:8px 20px;opacity:.38;transition:opacity .5s var(--ease)}
.step.now{opacity:1}
.step:last-child{border-bottom:1px solid var(--line)}
.step .n{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.step p{color:var(--mute);margin-top:8px;max-width:46ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chips span{padding:6px 13px;border:1px solid var(--line);border-radius:999px;font-size:13.5px;font-weight:600}
.chips span.hot{background:var(--gold);border-color:var(--gold);color:var(--ink)}
@media (max-width:820px){.steps{grid-template-columns:1fr}.steps-media{position:static;aspect-ratio:16/10}.step{opacity:1}}

/* Uses */
.uses{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.use{position:relative;border-radius:26px;overflow:hidden;background:var(--sand);min-height:300px;isolation:isolate}
.use:nth-child(1){grid-column:span 7;aspect-ratio:7/5}
.use:nth-child(2){grid-column:span 5}
.use:nth-child(3){grid-column:span 5}
.use:nth-child(4){grid-column:span 7;aspect-ratio:7/5}
.use img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transform:scale(1.12);transition:transform 1.4s var(--ease)}
.use.in img{transform:scale(1)}
.use::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(18,18,19,0) 40%,rgba(18,18,19,.86))}
.use-txt{position:absolute;inset:auto 0 0 0;padding:26px;color:var(--paper)}
.use-txt p{font-size:15.5px;color:#D9D6CD;margin-top:6px;max-width:40ch}
@media (max-width:820px){.use:nth-child(n){grid-column:span 12;aspect-ratio:4/3;min-height:0}}

/* Pricing */
.plans{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.plan{padding:26px 24px 28px;border-radius:24px;border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.plan.best{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.plan-name{font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.plan-name em{font-style:normal;font-size:12px;font-weight:700;background:var(--ink);color:var(--gold);padding:3px 10px;border-radius:999px}
.plan-price{font-family:var(--display);font-weight:800;font-size:clamp(30px,2.9vw,40px);letter-spacing:-.03em;line-height:1.1;margin-top:10px;font-variant-numeric:tabular-nums}
.plan-price small{font-family:var(--body);font-size:14px;font-weight:600;letter-spacing:0;opacity:.7;margin-right:4px}
.plan ul{list-style:none;margin:14px 0 0;padding:14px 0 0;border-top:1px solid var(--line);display:grid;gap:8px;font-size:15px}
.plan.best ul{border-color:rgba(27,27,28,.2)}
.plan li{display:flex;gap:9px;align-items:flex-start}
.plan li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.55;margin-top:.58em}
.pay{margin-top:26px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;color:var(--mute);font-size:15px}
.pay b{color:var(--paper);font-weight:600}
@media (max-width:980px){.plans{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.plans{grid-template-columns:1fr}}

/* Download */
.get{background:var(--gold);color:var(--ink)}
.get-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,6vw,96px);align-items:center}
.get h2{font-size:clamp(40px,6.6vw,92px);line-height:.96}
.get .lede{color:#4a3c12;margin-top:20px}
.get-cta{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:30px}
.get-meta{font-size:14px;font-weight:600;color:#4a3c12}
.howto{list-style:none;margin:0;padding:0;display:grid;gap:0;counter-reset:s}
.howto li{counter-increment:s;display:grid;grid-template-columns:44px 1fr;gap:16px;padding:20px 0;border-top:1.5px solid rgba(27,27,28,.22)}
.howto li:last-child{border-bottom:1.5px solid rgba(27,27,28,.22)}
.howto li::before{content:counter(s);font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1}
.howto b{display:block;font-size:18px}
.howto span{display:block;font-size:15.5px;color:#4a3c12;margin-top:3px}
@media (max-width:820px){.get-grid{grid-template-columns:1fr}}

/* FAQ */
.faq{max-width:860px}
.faq details{border-top:1px solid var(--line-ink)}
.faq details:last-child{border-bottom:1px solid var(--line-ink)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:20px;align-items:center;padding:22px 0;font-family:var(--display);font-weight:600;font-size:clamp(19px,2vw,23px);letter-spacing:-.01em}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"";flex:none;width:14px;height:14px;border-right:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:rotate(45deg) translate(-3px,-3px);transition:transform .3s var(--ease)}
.faq details[open] summary::after{transform:rotate(-135deg) translate(-3px,-3px)}
.faq details p{padding:0 0 24px;color:var(--mute-ink);max-width:66ch}

/* Footer */
footer{padding:44px 0 calc(44px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);color:var(--mute);font-size:14.5px}
.foot{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:center;justify-content:space-between}
.foot nav{display:flex;flex-wrap:wrap;gap:22px}
.foot a{text-decoration:none}
.foot a:hover{color:var(--paper)}

/* Support chat */
.chat-fab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;height:58px;padding:0 22px 0 18px;border-radius:999px;background:var(--gold);color:var(--ink);display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .25s var(--ease),opacity .2s}
.chat-fab:hover{transform:translateY(-2px)}
.chat-fab:active{transform:scale(.96)}
.chat-open .chat-fab{transform:scale(.6);opacity:0;pointer-events:none}
.chat{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:61;width:min(390px,calc(100vw - 24px));height:min(580px,calc(100dvh - 36px));background:var(--ink);color:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 70px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden;transform-origin:100% 100%;transform:scale(.9) translateY(14px);opacity:0;visibility:hidden;transition:transform .3s var(--ease),opacity .22s,visibility 0s .3s}
.chat-open .chat{transform:none;opacity:1;visibility:visible;transition:transform .3s var(--ease),opacity .22s}
.chat-head{flex:none;display:flex;align-items:center;gap:12px;padding:14px 12px 14px 18px;border-bottom:1px solid var(--line)}
.chat-head svg[data-mark]{width:28px;height:28px;flex:none}
.chat-head b{display:block;font-family:var(--display);font-size:17px;line-height:1.2}
.chat-head span{display:block;font-size:12.5px;color:var(--mute)}
.chat-x{margin-left:auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--mute)}
.chat-x:hover{background:rgba(244,243,239,.08);color:var(--paper)}
.chat-log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.cb{max-width:86%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.cb.bot{align-self:flex-start;background:var(--raise);border-bottom-left-radius:6px}
.cb.me{align-self:flex-end;background:var(--gold);color:var(--ink);border-bottom-right-radius:6px}
.cb.wait{display:flex;gap:5px;padding:14px}
.cb.wait i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:dot 1.1s ease-in-out infinite}
.cb.wait i:nth-child(2){animation-delay:.15s}.cb.wait i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.chat-form{flex:none;display:flex;gap:8px;align-items:center;padding:12px;border-top:1px solid var(--line)}
.chat-form input{flex:1;min-width:0;background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:12px 16px;color:var(--paper);font:inherit;font-size:16px}
.chat-form input::placeholder{color:var(--mute)}
.chat-form button{flex:none;width:44px;height:44px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center}
@media (max-width:480px){.chat{right:12px;bottom:12px;height:min(580px,calc(100dvh - 24px))}.chat-fab span{display:none}.chat-fab{padding:0;width:58px;justify-content:center}}

/* Motion: one page-load sequence in the hero, then quiet reveals for whole blocks */
.js .hero h1 .ln>span{transform:translateY(105%);animation:rise 1s var(--ease) forwards}
.js .hero h1 .ln:nth-child(2)>span{animation-delay:.09s}
.js .hero h1 .ln:nth-child(3)>span{animation-delay:.18s}
.js .hero .fade{opacity:0;transform:translateY(16px);animation:fadeup .9s var(--ease) .42s forwards}
.js .hero .demo{opacity:0;transform:translateY(28px) scale(.98);animation:fadeup 1s var(--ease) .6s forwards}
.js .hero-media video{opacity:0;transition:opacity 1.2s ease}
.js .hero-media video.ready{opacity:1}
@keyframes rise{to{transform:none}}
@keyframes fadeup{to{opacity:1;transform:none}}
.js .rv{opacity:0}
.js .rv.in{opacity:1;animation:reveal .8s var(--ease) backwards;animation-delay:calc(var(--i,0)*70ms)}
@keyframes reveal{from{opacity:0;transform:translateY(26px)}}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  .js .hero h1 .ln>span,.js .hero .fade,.js .hero .demo,.js .rv{opacity:1;transform:none}
  .js .hero-media video{opacity:1}
  .use img{transform:none}
  .step{opacity:1}
}
</style>
</head>
<body>

<header class="nav" id="nav">
  <div class="wrap nav-in">
    <a class="brand" href="#juu" aria-label="SautiPlus AI"><svg viewBox="0 0 64 64" aria-hidden="true" data-mark></svg>SautiPlus</a>
    <nav class="nav-links" aria-label="Sehemu za ukurasa">
      <a href="#sauti" data-t="navVoices"></a>

      <ul><li>${t("mins")(p.min)}${p.clones?" "+t("perMonth"):""}</li><li>${p.clones?t("clones")(p.clones):t("about")(p.min*2)}</li><li>${t("mp3")}</li></ul>
    </div>`).join("");
  $("#faq").innerHTML = t("faq").map(([q,a]) => `<details class="rv"><summary>${q}</summary><p>${a}</p></details>`).join("");
  $("#typed").textContent = t("demoScript");
  if(apkInfo) $("#apkMeta").textContent = t("meta")(apkInfo.v, apkInfo.mb);
  $("#chatInput").placeholder = t("chatPh"); $("#chatInput").setAttribute("aria-label", t("chatPh"));
  $("#chatSend").setAttribute("aria-label", t("chatSend")); $("#chatX").setAttribute("aria-label", t("chatClose"));
  renderChat();
  watch();
}
$$("[data-lang]").forEach(b => b.onclick = () => { L = b.dataset.lang; try{ localStorage.setItem("sp-lang", L); }catch(e){} render(); });

/* ---------- logo ---------- */
$$("[data-mark]").forEach(s => s.innerHTML = [[0,20,18],[1,10,38],[2,2,54],[3,16,22,1],[4,9,40],[5,19,18]].map(([i,y,h,g]) => `<rect x="${8+i*9.4}" y="${y+4}" width="5.4" height="${h}" rx="2.7" fill="${g?"#E8C055":"currentColor"}"/>`).join(""));

/* ---------- voice player: one clip at a time, tap again to stop ---------- */
const audio = new Audio(); audio.preload = "none";
let current = null, ctx = null, analyser = null, raf = 0;
const bars = $("#bars");
const SHAPE = Array.from({length:44}, (_,i) => .16 + .5*Math.abs(Math.sin(i*.55))*Math.abs(Math.cos(i*.21)));
bars.innerHTML = SHAPE.map(h => `<i style="--h:${h.toFixed(2)}"></i>`).join("");
const barEls = [...bars.children];
function mark(id, on){
  $$(`[data-play="${id}"]`).forEach(b => { b.classList.toggle("playing", on); b.setAttribute("aria-label", `${t(on?"stop":"listen")} ${VOICES.find(v=>v.id===id).name}`); });
}
function stop(){
  if(!current) return;
  audio.pause(); mark(current, false); current = null;
  cancelAnimationFrame(raf); bars.classList.remove("live");
  barEls.forEach((b,i) => b.style.setProperty("--h", SHAPE[i].toFixed(2)));
}
function draw(){
  if(!analyser) return;
  const data = new Uint8Array(analyser.frequencyBinCount); analyser.getByteFrequencyData(data);
  barEls.forEach((b,i) => { const v = data[2 + Math.floor(i * 1.3)] / 255; b.style.setProperty("--h", Math.max(.08, v).toFixed(2)); });
  raf = requestAnimationFrame(draw);
}
function play(id){
  const same = current === id;
  stop(); if(same) return;
  current = id; audio.src = `voices/samples/${id}.mp3`; mark(id, true);
  try{
    if(!ctx){ const AC = window.AudioContext || window.webkitAudioContext; ctx = new AC(); analyser = ctx.createAnalyser(); analyser.fftSize = 256; analyser.smoothingTimeConstant = .72; ctx.createMediaElementSource(audio).connect(analyser); analyser.connect(ctx.destination); }
    ctx.resume();
  }catch(e){}
  audio.play().then(() => { if(current === id){ bars.classList.add("live"); draw(); } }).catch(() => { if(current === id) stop(); });
}
audio.onended = stop;
document.addEventListener("click", e => { const b = e.target.closest("[data-play]"); if(b) play(b.dataset.play); });

/* ---------- support chat: answered by an AI on the SautiPlus server ---------- */
const API = "https://zvsphyuxyidxarimngbr.supabase.co/functions/v1/api";
const escHtml = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
let chat = [], chatBusy = false; // chat: {role:"user"|"bot", text} or a failed reply {role:"bot", failed:"chatFail"}
function renderChat(){
  const log = $("#chatLog");
  log.innerHTML = `<div class="cb bot">${escHtml(t("chatHello"))}</div>` +
    chat.map(m => `<div class="cb ${m.role==="user"?"me":"bot"}">${escHtml(m.failed ? t(m.failed) : m.text)}</div>`).join("") +
    (chatBusy ? `<div class="cb bot wait" role="status" aria-label="${t("chatWait")}"><i></i><i></i><i></i></div>` : "");
  log.scrollTop = log.scrollHeight;
}
function toggleChat(open){
  document.body.classList.toggle("chat-open", open);
  $("#chatFab").setAttribute("aria-expanded", open);
  if(open){ renderChat(); setTimeout(() => $("#chatInput").focus(), 60); } else $("#chatFab").focus();
}
$("#chatFab").onclick = () => toggleChat(true);
$("#chatX").onclick = () => toggleChat(false);
addEventListener("keydown", e => { if(e.key === "Escape" && document.body.classList.contains("chat-open")) toggleChat(false); });
$("#chatForm").onsubmit = async e => {
  e.preventDefault();
  const text = $("#chatInput").value.trim();
  if(!text || chatBusy) return;
  $("#chatInput").value = "";
  chat.push({ role:"user", text }); chatBusy = true; renderChat();
  try{
    const r = await fetch(API + "/support", { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ lang:L, messages:chat.filter(m => !m.failed).slice(-12).map(m => ({ role:m.role, text:m.text })) }) });
    if(!r.ok) throw r.status;
    chat.push({ role:"bot", text:(await r.json()).reply });
  }catch(err){ chat.push({ role:"bot", failed: err === 429 ? "chatSlow" : "chatFail" }); }
  chatBusy = false; renderChat();
};

/* ---------- tabs ---------- */
$$("[data-tab]").forEach(b => b.onclick = () => {
  $$("[data-tab]").forEach(x => x.setAttribute("aria-selected", x === b));
  $("#voices-sw").hidden = b.dataset.tab !== "sw"; $("#voices-en").hidden = b.dataset.tab !== "en";
  $$(`#voices-${b.dataset.tab} .rv`).forEach(el => el.classList.add("in"));
});

/* ---------- scroll: reveals, step highlight, lazy video, nav ---------- */
const io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }), { rootMargin:"0px 0px -8% 0px", threshold:.08 });
function watch(){ $$(".rv:not(.in), .use:not(.in)").forEach(el => io.observe(el)); }
const stepIo = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ $$(".step").forEach(s => s.classList.toggle("now", s === e.target)); } }), { rootMargin:"-45% 0px -45% 0px" });
$$(".step").forEach(s => stepIo.observe(s));
const vidIo = new IntersectionObserver(es => es.forEach(e => { const v = e.target; if(e.isIntersecting){ v.play().catch(()=>{}); } else v.pause(); }), { threshold:.15 });
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
$$("video").forEach(v => { v.addEventListener("playing", () => v.classList.add("ready"), { once:true }); if(!calm) vidIo.observe(v); });
const nav = $("#nav"); const onScroll = () => nav.classList.toggle("stuck", scrollY > 24); addEventListener("scroll", onScroll, { passive:true }); onScroll();

/* ---------- download button: version and size come from the same file the app reads ---------- */
fetch("app/version.json", { cache:"no-store" }).then(r => r.json()).then(v => {
  apkInfo = { v: v.apkVersion, mb: (v.apkBytes/1048576).toFixed(1) };
  $("#apkMeta").textContent = t("meta")(apkInfo.v, apkInfo.mb);
}).catch(()=>{});

$("#yr").textContent = new Date().getFullYear();
render();
</script>
