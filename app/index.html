<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SautiPlus AI</title>
<meta name="theme-color" content="#1B1B1C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one-screen chat app — top bar, scrolling conversation, pinned composer; drawer left, sheets from bottom. Dark-first to match the logo. */
:root{
  --bg:#1B1B1C; --surface:#242426; --surface-2:#2E2E31; --line:#3A3A3E;
  --fg:#F4F3EF; --muted:#A3A19B; --gold:#E8C055; --gold-ink:#1B1B1C;
  --ok:#5BC48A; --warn:#E08A5B; --scrim:rgba(0,0,0,.55);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#FAF9F6; --surface:#FFFFFF; --surface-2:#F1EFEA; --line:#E2DFD8;
    --fg:#1B1B1C; --muted:#6B6963; --gold:#D4A62A; --gold-ink:#1B1B1C;
    --scrim:rgba(20,20,20,.35); color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#FAF9F6; --surface:#FFFFFF; --surface-2:#F1EFEA; --line:#E2DFD8;
  --fg:#1B1B1C; --muted:#6B6963; --gold:#D4A62A; --gold-ink:#1B1B1C;
  --scrim:rgba(20,20,20,.35); color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg{display:block}

.app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto}

/* Animated logo: bars move like a sound wave */
.logo-mark.alive rect{transform-box:fill-box;transform-origin:center;animation:wave 1.3s ease-in-out infinite}
.logo-mark.alive rect:nth-child(1){animation-delay:-.75s}
.logo-mark.alive rect:nth-child(2){animation-delay:-.6s}
.logo-mark.alive rect:nth-child(3){animation-delay:-.45s}
.logo-mark.alive rect:nth-child(4){animation-delay:-.3s}
.logo-mark.alive rect:nth-child(5){animation-delay:-.15s}
.logo-mark.alive rect:nth-child(6){animation-delay:0s}
@keyframes wave{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.35)}}
@media (prefers-reduced-motion:reduce){.logo-mark.alive rect{animation:none}}

/* Top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;flex:none}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.icon-btn:hover{background:var(--surface)}
.voice-pill{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;font-weight:700;font-size:16px}
.voice-pill:hover{background:var(--surface)}
.voice-pill small{color:var(--muted);font-weight:500;font-size:14px}

/* Conversation */
.scroll{flex:1;overflow-y:auto;padding-inline:16px;padding-block:8px 24px;overscroll-behavior:contain}
.empty{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding-block:24px}
.empty h1{margin:0;font-size:24px;line-height:1.25;font-weight:700;text-wrap:balance;max-width:22ch}
.empty p{margin:-10px 0 0;color:var(--muted);max-width:34ch}
.ideas{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:520px}
.idea{text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-md);background:transparent;display:flex;flex-direction:column;gap:2px;min-width:0}
.idea:hover{background:var(--surface)}
.idea b{font-size:14px;font-weight:600}
.idea span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.msgs{display:flex;flex-direction:column;gap:18px}
.u{align-self:flex-end;max-width:85%;background:var(--surface-2);padding:10px 16px;border-radius:var(--r-lg);white-space:pre-wrap;word-wrap:break-word}
.tg{color:var(--gold);font-size:.85em;font-weight:600}
.a{align-self:stretch;display:flex;flex-direction:column;gap:8px}
.a-head{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.a-head .mark{width:22px;height:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px;display:flex;align-items:center;gap:12px}
.play{width:46px;height:46px;flex:none;border-radius:50%;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center}
.wave{flex:1;min-width:0;height:40px;display:flex;align-items:center;gap:3px;overflow:hidden}
.wave i{flex:1;min-width:2px;max-width:5px;border-radius:3px;background:var(--line);transition:background .15s}
.wave i.on{background:var(--gold)}
.dur{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.actions{display:flex;flex-wrap:wrap;gap:4px}
.act{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding:6px 10px;border-radius:999px}
.act:hover{background:var(--surface);color:var(--fg)}
.act[disabled]{opacity:.45;cursor:not-allowed}
.note{font-size:12px;color:var(--muted)}
.gen .wave i{animation:pulse 1s ease-in-out infinite;background:var(--gold);opacity:.35}
@keyframes pulse{50%{opacity:1;transform:scaleY(.5)}}
@media (prefers-reduced-motion:reduce){.gen .wave i{animation:none;opacity:.6}}

/* Composer */
.composer{flex:none;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.box{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:10px 10px 10px 16px;display:flex;flex-direction:column;gap:8px}
.box textarea{width:100%;resize:none;border:0;background:transparent;color:var(--fg);font:inherit;font-size:16px;max-height:180px;min-height:26px;padding:2px 0;outline:none}
.box textarea::placeholder{color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tools{display:flex;align-items:center;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;margin-left:-6px;padding-left:6px}
.tools::-webkit-scrollbar{display:none}
.chip{flex:none;white-space:nowrap;display:flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:600}
.chip:hover{background:var(--surface-2)}
.chip.magic{color:var(--gold)}
.chip[disabled]{opacity:.45;cursor:not-allowed}
.chip[disabled]:hover{background:none}
.send{width:38px;height:38px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;flex:none}
.send[disabled]{background:var(--surface-2);color:var(--muted);cursor:not-allowed}
.foot{text-align:center;font-size:11px;color:var(--muted);padding-top:6px;font-variant-numeric:tabular-nums}

/* Segmented toggle (language, voice filter) */
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:6px 14px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--gold);color:var(--gold-ink)}
.seg.full{display:flex}.seg.full button{flex:1}

/* Drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(320px,86vw);background:var(--bg);border-right:1px solid var(--line);z-index:11;transform:translateX(-100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px))}
.drawer.show{transform:none}
.brand{padding:4px 6px 14px}
.brand svg{height:30px;width:auto}
.newbtn{display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--r-md);font-weight:600}
.newbtn:hover{background:var(--surface)}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 12px 6px}
.hist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.hist button{text-align:left;padding:10px 12px;border-radius:var(--r-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.hist button:hover,.hist button.cur{background:var(--surface)}
.hist .none{color:var(--muted);font-size:14px;padding:6px 12px}
.drow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 4px 0;font-size:14px;color:var(--muted)}
.drow .seg button{padding:5px 11px;font-size:13px}
.bal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:10px;margin-top:10px}
.bal-top{display:flex;justify-content:space-between;align-items:baseline}
.bal-top b{font-size:22px;font-variant-numeric:tabular-nums}
.bal-top span{font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
.gold-btn{background:var(--gold);color:var(--gold-ink);font-weight:700;border-radius:999px;padding:11px 16px;text-align:center}
.gold-btn[disabled]{opacity:.5;cursor:not-allowed}
.me{display:flex;align-items:center;gap:10px;padding:12px 2px 0}
.me .avatar{width:34px;height:34px;font-size:14px;background:var(--gold)}
.me-txt{flex:1;min-width:0;line-height:1.3}
.me-txt b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-txt span{font-size:12px;color:var(--muted)}

/* Bottom sheets */
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88%;background:var(--bg);border-top:1px solid var(--line);border-radius:24px 24px 0 0;z-index:12;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;max-width:760px;margin:0 auto}
.sheet.show{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 4px;flex:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 10px;flex:none}
.sheet-head h2{margin:0;font-size:18px}
.sheet-body{overflow-y:auto;padding:0 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.sub{color:var(--muted);font-size:14px;margin:0 0 4px}

.voice{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:var(--r-md);text-align:left;width:100%}
.voice.sel{border-color:var(--gold);background:var(--surface)}
.avatar{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;color:var(--gold-ink)}
.voice-txt{flex:1;min-width:0}
.voice-txt b{display:block}
.voice-txt span{display:block;font-size:12px;color:var(--muted)}
img.avatar{object-fit:cover;background:var(--surface-2)}
.mini-play{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none}
/* The menu logo's sound bars move all the time, like the big logo on the home screen */
#wordmark rect{transform-box:fill-box;transform-origin:center;animation:wave 1.3s ease-in-out infinite}
#wordmark rect:nth-child(1){animation-delay:-.75s}#wordmark rect:nth-child(2){animation-delay:-.6s}#wordmark rect:nth-child(3){animation-delay:-.45s}
#wordmark rect:nth-child(4){animation-delay:-.3s}#wordmark rect:nth-child(5){animation-delay:-.15s}
/* Pull down to refresh */
.ptr{position:fixed;top:calc(62px + env(safe-area-inset-top,0px));left:50%;z-index:5;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);transform:translate(-50%,-70px);opacity:0;pointer-events:none}
.ptr.ready{color:var(--gold);border-color:var(--gold)}
.ptr.back{transition:transform .25s cubic-bezier(.2,.8,.2,1),opacity .25s}
.ptr.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#wordmark rect,.ptr.spin svg{animation:none}}
/* Press and hold a message to delete it */
.msgs .u,.msgs .a{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.msgs .held{outline:2px solid var(--gold);outline-offset:3px;border-radius:var(--r-lg)}
.gold-btn.del{background:#D9534F;color:#fff}
/* Voice recorder (voice cloning) */
#recSheet{height:88%}
.rec input{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;color:var(--fg);font:inherit;font-size:16px;width:100%}
.rec input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.rec label{font-size:13px;font-weight:600}
.rec-script{margin:0;padding:14px 16px;border-left:3px solid var(--gold);background:var(--surface);border-radius:0 var(--r-md) var(--r-md) 0;font-size:16px;line-height:1.6}
.rec-row{display:flex;align-items:center;gap:14px}
.rec-btn{flex:none;width:64px;height:64px;border-radius:50%;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center}
.rec-btn[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.rec-btn:disabled{opacity:.4}
.rec-row b{display:block;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
.rec-row span{font-size:13px;color:var(--muted)}
.rec audio{width:100%}
.rec-or{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rec-or .chip{background:transparent;color:var(--fg)}
.rec-or small{font-size:12px;color:var(--muted)}
/* Terms and conditions */
#termsSheet{z-index:35;height:88%}
.terms h3{margin:14px 0 4px;font-size:15px}
.terms p{margin:0;font-size:14px;color:var(--muted);line-height:1.55}
.terms ul{margin:0;padding-left:18px;font-size:14px;color:var(--muted);line-height:1.55;display:grid;gap:6px}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4;cursor:pointer}
.agree input{flex:none;width:20px;height:20px;margin:0;accent-color:var(--gold)}
.terms-link{align-self:center;margin-top:10px;font-size:12px;color:var(--muted);font-weight:500;text-decoration:underline}
/* Support chat */
#chatSheet{height:88%}
.chat-log{flex:1;padding-top:4px}
.cb{max-width:86%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.cb.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.cb.me{align-self:flex-end;background:var(--gold);color:var(--gold-ink);border-bottom-right-radius:6px}
.cb.wait{display:flex;gap:5px;padding:14px}
.cb.wait i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dot 1.1s ease-in-out infinite}
.cb.wait i:nth-child(2){animation-delay:.15s}.cb.wait i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.cb.wait i{animation:none}}
.chat-form{flex:none;display:flex;gap:8px;align-items:center;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.chat-form input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:11px 16px;color:var(--fg);font:inherit;font-size:16px}
.chat-form input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mini-play.on{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.lock{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--gold);white-space:nowrap}

.expr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.expr{padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-md);text-align:left;font-weight:600;font-size:15px}
.expr small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.expr.sel{border-color:var(--gold);background:var(--surface)}

.plan{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px;border:1px solid var(--line);border-radius:var(--r-md);text-align:left;width:100%}
.plan.sel{border-color:var(--gold);background:var(--surface)}
.plan b{font-size:16px}
.plan .price{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;text-align:right}
.plan .what{color:var(--muted);font-size:13px;grid-column:1/-1}
.tag{display:inline-block;font-size:11px;font-weight:700;color:var(--gold-ink);background:var(--gold);padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:2px}

.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pay{padding:12px;border:1px solid var(--line);border-radius:var(--r-md);font-weight:600;font-size:14px;text-align:center}
.pay.sel{border-color:var(--gold);background:var(--surface)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.field input{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;color:var(--fg);font:inherit;font-size:16px;width:100%}
.field input[aria-invalid="true"]{border-color:var(--warn)}
.err{font-size:12px;color:var(--warn);min-height:0}
.demo-flag{font-size:12px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r-sm);padding:8px 10px}

/* Login */
.auth{position:fixed;inset:0;background:var(--bg);z-index:30;overflow-y:auto;display:flex;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.auth-in{width:100%;max-width:400px;margin:auto 0;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.auth h1{margin:0;font-size:26px;line-height:1.2}
.auth .sub{margin:-8px 0 0}
.auth form{width:100%;display:flex;flex-direction:column;gap:14px;text-align:left}
.consent{font-size:12px;color:var(--muted);margin:0}
.phone-row{display:flex;gap:8px}
.phone-row select{flex:none;width:124px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 8px 12px 12px;color:var(--fg);font:inherit;font-size:16px}
.phone-row select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.phone-row input{flex:1;min-width:0}
.pw{position:relative}
.pw input{padding-right:50px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.eye:hover{color:var(--fg)}
.link{color:var(--gold);font-weight:600;font-size:14px}
.link:hover{text-decoration:underline}
.switch{margin:0;text-align:center;font-size:14px;color:var(--muted)}
.okmsg{margin:0;font-size:14px;color:var(--ok);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px}

.top-r{display:flex;align-items:center}
.bell{position:relative}
.badge{position:absolute;top:6px;right:5px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--gold);color:var(--gold-ink);font-size:11px;font-weight:800;display:grid;place-items:center;line-height:1}
.nt{border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.nt.new{border-color:var(--gold);background:var(--surface)}
.nt b{display:block}
.nt p{margin:4px 0;white-space:pre-wrap;word-wrap:break-word}
.nt span{font-size:12px;color:var(--muted)}
.admin-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-md);font-weight:600;color:var(--gold);text-decoration:none;font-size:15px}
.admin-link:hover{background:var(--surface)}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:40;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* Drag the wave to move through a voice over; the logo above it dances while it plays */
.wave{cursor:pointer;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.wave.seek i{transition:none}
.a.playing .mark rect{transform-box:fill-box;transform-origin:center;animation:wave 1.3s ease-in-out infinite}
.a.playing .mark rect:nth-child(1){animation-delay:-.75s}.a.playing .mark rect:nth-child(2){animation-delay:-.6s}.a.playing .mark rect:nth-child(3){animation-delay:-.45s}
.a.playing .mark rect:nth-child(4){animation-delay:-.3s}.a.playing .mark rect:nth-child(5){animation-delay:-.15s}
@media (prefers-reduced-motion:reduce){.a.playing .mark rect{animation:none}}
.a-head .mark{flex:none}
/* Copy button under the user's script */
.u-wrap{align-self:flex-end;max-width:85%;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.u-wrap .u{max-width:100%}
/* History rows with a delete button */
.hrow{display:flex;align-items:center;border-radius:var(--r-sm)}
.hrow:hover,.hrow.cur{background:var(--surface)}
.hrow>button:first-child{flex:1;min-width:0;background:none!important}
.hist .hdel{width:34px;height:34px;padding:0;flex:none;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.hist .hdel:hover{color:var(--warn)}
.label.sp{display:flex;align-items:center;justify-content:space-between}
@media (max-width:420px){.ideas{grid-template-columns:1fr}.idea:nth-child(n+3){display:none}}
</style>

/* ---------- state ---------- */
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem("sautiplus")||"null"); }catch(e){ return null; } },
  set(v){ try{ localStorage.setItem("sautiplus", JSON.stringify(v)); }catch(e){} }
};
const saved = store.get();
let S = Object.assign({ balance: CONFIG.TRIAL_SECONDS, total: CONFIG.TRIAL_SECONDS, planId:"trial", voice:"baraka", expr:"neutral", voiceFilter:"sw", lang:"sw", unlimited:false, clones:[], user:null, notifSeen:0, freeTests:[], pendingPlan:null, chats: [], cur: null, publicVoices:[], synced:{}, upl:{}, delQ:[], langChosen:false, owner:null }, saved);
if(saved && saved.plan && !saved.planId){ S.planId = (PLANS.find(p=>p.name===saved.plan)||{id:"trial"}).id; } // older saved format
delete S.plan;
const persist = () => store.set({ ...S, chats: S.chats.map(c=>({...c, msgs:c.msgs.map(m=>({...m, url:null}))})) });
const save = () => { persist(); schedulePush(); };
const audioCache = {}; // id -> blob URL for this session
// Generated audio is kept on the phone (IndexedDB) so old voice overs still play after the app is closed.
const audioStore = (()=>{
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej)=>{ const q=indexedDB.open("sautiplus-audio",1); q.onupgradeneeded=()=>q.result.createObjectStore("a"); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }));
  const tx = async (mode, fn) => { const db=await open(); return new Promise((res, rej)=>{ const t=db.transaction("a",mode), rq=fn(t.objectStore("a")); t.oncomplete=()=>res(rq.result); t.onerror=()=>rej(t.error); }); };
  return { put:(id,blob)=>tx("readwrite",st=>st.put(blob,id)).catch(()=>{}), get:id=>tx("readonly",st=>st.get(id)).catch(()=>null), del:id=>tx("readwrite",st=>st.delete(id)).catch(()=>{}), clear:()=>tx("readwrite",st=>st.clear()).catch(()=>{}) };
})();
// On this device first; otherwise the copy kept on the server (so voice overs made on another device play here too).
async function audioUrl(m){
  if(!audioCache[m.id]){ const b=await audioStore.get(m.id); if(b) audioCache[m.id]=URL.createObjectURL(b); }
  if(!audioCache[m.id] && S.user?.token){
    try{ const r = await api("/audio/"+m.id); if(r.ok){ const b = await r.blob(); audioStore.put(m.id, b); audioCache[m.id]=URL.createObjectURL(b); S.upl[m.id]=1; } }catch(e){}
  }
  return audioCache[m.id] || null;
}

/* ---------- conversations kept on the server ----------
   Every conversation (and the MP3 of each voice over) is copied to the user's account, so the history is the same
   in the phone app and in the browser. S.synced[id] = what the server has; S.delQ = deletions still to send. */
const chatSig = c => JSON.stringify([c.title, c.msgs.filter(m=>m.status!=="gen").map(m=>m.role==="user" ? [m.text] : [m.id, m.voice, m.expr, m.text, m.sec])]);
let pushTimer = null, backfilling = false;
function schedulePush(){ if(!S.user?.token) return; clearTimeout(pushTimer); pushTimer = setTimeout(pushChats, 1500); }
async function pushChats(){
  if(!S.user?.token) return;
  for(const c of S.chats){
    const sig = chatSig(c);
    if(S.synced[c.id]===sig || !c.msgs.some(m=>m.status!=="gen")) continue;
    try{
      const r = await api("/chats/"+c.id, { title:c.title, msgs:c.msgs.filter(m=>m.status!=="gen") }, "PUT");
      if(r.status===401) return;
      if(r.ok){ S.synced[c.id] = sig; persist(); }
    }catch(e){ return; }
  }
}
async function uploadAudio(id, blob){
  if(!S.user?.token) return;
  try{ const r = await fetch(CONFIG.API+"/audio/"+id, { method:"POST", headers:{ Authorization:"Bearer "+S.user.token, "Content-Type":"audio/mpeg" }, body:blob }); if(r.ok){ S.upl[id]=1; persist(); } }catch(e){}
}
// Voice overs made before history sync existed are copied to the server once.
async function backfillAudio(){
  if(backfilling || !S.user?.token) return;
  backfilling = true;
  try{
    for(const c of S.chats) for(const m of c.msgs){
      if(m.role!=="voice" || m.status!=="ready" || S.upl[m.id]) continue;
      const b = await audioStore.get(m.id);
      if(b) await uploadAudio(m.id, b); else S.upl[m.id] = 1; // nothing on this device: it came from the server
    }
    persist();
  }catch(e){}
  backfilling = false;
}
async function flushDeletes(){
  for(const id of [...S.delQ]){
    try{ const r = await api("/chats/"+id, undefined, "DELETE"); if(r.ok || r.status===404) S.delQ = S.delQ.filter(x=>x!==id); }catch(e){ return; }
  }
  persist();
}
async function pullChats(){
  if(!S.user?.token || document.querySelector(".a.gen")) return;
  try{
    await flushDeletes();
    const r = await api("/chats"); if(!r.ok) return;
    const list = await r.json(), ids = new Set(list.map(x=>x.id));
    let changed = false;
    for(const sc of list){
      if(S.delQ.includes(sc.id)) continue;
      const local = S.chats.find(c=>c.id===sc.id), copy = { id:sc.id, title:sc.title, msgs:sc.msgs };
      if(local && S.synced[sc.id]!==chatSig(local)) continue; // changed on this device and not uploaded yet: keep it
      if(local && chatSig(local)===chatSig(copy)){ S.synced[sc.id] = chatSig(copy); continue; }
      if(local) S.chats[S.chats.indexOf(local)] = copy; else S.chats.push(copy);
      S.synced[sc.id] = chatSig(copy); changed = true;
    }
    const before = S.chats.length;
    S.chats = S.chats.filter(c=>ids.has(c.id) || !S.synced[c.id]); // deleted on another device
    if(S.chats.length!==before) changed = true;
    if(S.cur && !curChat()) S.cur = null;
    persist();
    if(changed) renderAll();
    pushChats(); backfillAudio();
  }catch(e){}
}

/* ---------- prices in the user's own currency ----------
   The country comes from the phone number the account was made with. Prices are only converted for display
   (payment is still in TSh). Rates come from a free public rate service, refreshed daily; the table below is the fallback. */
const CUR_BY_DIAL = Object.fromEntries(("254:KES 256:UGX 250:RWF 257:BIF 243:CDF 27:ZAR 234:NGN 233:GHS 260:ZMW 265:MWK 258:MZN 251:ETB 20:EGP 212:MAD 216:TND 213:DZD 1:USD 44:GBP 91:INR 971:AED 966:SAR 974:QAR 86:CNY 81:JPY 82:KRW 61:AUD 64:NZD 7:RUB 55:BRL 52:MXN 90:TRY 92:PKR 880:BDT 62:IDR 60:MYR 65:SGD 63:PHP 41:CHF 46:SEK 47:NOK 45:DKK 48:PLN "
  + "33:EUR 49:EUR 39:EUR 34:EUR 31:EUR 32:EUR 43:EUR 351:EUR 353:EUR 358:EUR 30:EUR 352:EUR 356:EUR 357:EUR 371:EUR 370:EUR 372:EUR 386:EUR 421:EUR 385:EUR").split(" ").map(x=>x.split(":")));
const RATES_FALLBACK = { TZS:2700, USD:1, KES:129, UGX:3650, RWF:1400, BIF:2900, CDF:2800, ZAR:18, NGN:1500, GHS:15, ZMW:26, MWK:1750, MZN:64, ETB:130, EGP:49, MAD:9.8, TND:3.1, DZD:134, GBP:.79, INR:84, AED:3.67, SAR:3.75, QAR:3.64, CNY:7.2, JPY:150, KRW:1350, AUD:1.5, NZD:1.65, RUB:92, BRL:5.5, MXN:19, TRY:34, PKR:280, BDT:120, IDR:15500, MYR:4.4, SGD:1.33, PHP:57, CHF:.88, SEK:10.5, NOK:10.7, DKK:6.9, PLN:4, EUR:.92 }; // units per 1 US dollar
let RATES = RATES_FALLBACK;
try{ const c = JSON.parse(localStorage.getItem("sautiplus-rates")||"null"); if(c?.rates?.TZS) RATES = c.rates; }catch(e){}
async function loadRates(){
  try{
    const c = JSON.parse(localStorage.getItem("sautiplus-rates")||"null");
    if(c && Date.now()-c.at < 86400000) return;
    const j = await (await fetch("https://open.er-api.com/v6/latest/USD")).json();
    if(j?.rates?.TZS){ RATES = j.rates; localStorage.setItem("sautiplus-rates", JSON.stringify({ at:Date.now(), rates:j.rates })); }
  }catch(e){}
}
function userCurrency(){
  const d = String(S.user?.phone||"").replace(/\D/g,"");
  if(!d || d.startsWith("255")) return "TZS";
  for(let k=3;k>=1;k--) if(CUR_BY_DIAL[d.slice(0,k)]) return CUR_BY_DIAL[d.slice(0,k)];
  return "USD";
}
// "≈ KES 1,290" for a Kenyan number, "10,000 TSh" for a Tanzanian one
function money(tzs){
  const cur = userCurrency();
  if(cur==="TZS" || !RATES[cur] || !RATES.TZS) return tsh(tzs);
  const v = tzs / RATES.TZS * RATES[cur];
  try{ return "≈ " + new Intl.NumberFormat(S.lang==="sw" ? "sw-TZ" : "en", { style:"currency", currency:cur, maximumFractionDigits: v>=100 ? 0 : 2 }).format(v); }
  catch(e){ return "≈ " + Math.round(v).toLocaleString("en-US") + " " + cur; }
}
const priceNote = () => userCurrency()==="TZS" ? "" : `<p class="demo-flag">${esc(t("priceNote", userCurrency()))}</p>`;
const TAG_RE = /\[[^\]\n]{1,30}\]\s*/g;
const stripTags = s => s.replace(TAG_RE, "");
const hasTags = s => /\[[^\]\n]{1,30}\]/.test(s);
const estSec = t => Math.max(1, Math.ceil(stripTags(t).trim().length / CONFIG.CHARS_PER_SEC));
// S.clones = this user's own cloned voices, [{id, name}]. In S.voice and in /tts they are called "clone:<id>".
const voiceOf = id => {
  const c = (S.clones || []).find(c=>"clone:"+c.id===id);
  if(c) return { id, name:c.name, clone:true };
  const pv = (S.publicVoices || []).find(v=>"public:"+v.id===id); // a voice another user shared with everyone
  if(pv) return { id, name:pv.name, clone:true };
  return VOICES.find(v=>v.id===(OLD_VOICES[id]||id)) || VOICES.find(v=>v.id==="baraka");
};
S.voice = voiceOf(S.voice).id;
const exprOf = id => EXPRS.find(x=>x.id===id) || EXPRS[0];
const planOf = id => PLANS.find(p=>p.id===id);

// Calls the online server with the user's login token.
function api(path, body, method){
  const headers = { "Content-Type":"application/json" };
  if(S.user?.token) headers.Authorization = "Bearer " + S.user.token;
  return fetch(CONFIG.API + path, body === undefined && !method ? { headers } : { method:method || "POST", headers, body: body === undefined ? undefined : JSON.stringify(body) });
}

function renderIdeas(){

function waveBars(seed, n=42){
  let h=0; for(const c of seed) h=(h*31+c.charCodeAt(0))>>>0;
  let out=""; for(let i=0;i<n;i++){ h=(h*1103515245+12345)>>>0; const v=18+(h%82); out+=`<i style="height:${v}%"></i>`; }
  return out;
}
function curChat(){ return S.chats.find(c=>c.id===S.cur); }
function renderMsgs(){
  const c = curChat();
  const has = c && c.msgs.length;
  $("empty").hidden = !!has; $("msgs").hidden = !has;
  if(!has){ $("msgs").innerHTML=""; return; }
  $("msgs").innerHTML = c.msgs.map((m,i) => m.role==="user"
    ? `<div class="u-wrap"><div class="u" data-i="${i}">${esc(m.text).replace(/\[([^\]\n]{1,30})\]/g,'<span class="tg">[$1]</span>')}</div>

    : voiceCard(m)).join("");

}
function exprLabel(m){

function voiceCard(m){

  return `<div class="a" data-id="${m.id}">
    <div class="a-head"><svg class="mark" viewBox="0 0 64 64">${markSVG()}</svg>${v.name}${exprLabel(m)}</div>

      <span class="dur" data-dur>${fmt(m.sec)}</span>
    </div>
    <div class="actions">
      <button class="act" data-act="dl"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>${t(NATIVE ? "share" : "download")}</button>
      <button class="act" data-act="redo"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>${t("redo")} · ${fmt(m.sec)}</button>
    </div>
  </div>`;
}

async function generate(text, voice, expr, isNew){
  const sec = estSec(text);
  if(!S.unlimited && !isFreeTest(text) && sec > S.balance){ openPlans(t("lowBal", fmt(S.balance), fmt(sec))); return; }
  let c = curChat();
  if(!c){ c={ id:uid(), title:stripTags(text).slice(0,40), msgs:[] }; S.chats.push(c); S.cur=c.id; }
  if(isNew){ c.msgs.push({ role:"user", text }); input.value=""; onInput(); }
  const m = { role:"voice", id:uid(), voice, expr, text, sec, status:"gen" };
  c.msgs.push(m);
  renderAll(); save();
  // The server checks the balance, takes the seconds and makes the audio. It answers with the new balance.
  let fail = null;
  try{
    const r = await api("/tts", { voiceKey:voice, text, expression:exprOf(expr).tag, lang:S.voiceFilter }); // lang = which language a cloned voice should read in
    if(r.ok){
      const blob = await r.blob();
      audioCache[m.id] = URL.createObjectURL(blob); audioStore.put(m.id, blob); uploadAudio(m.id, blob); // also kept on the server, for the user's other devices
      if(r.headers.get("x-balance") !== null){ S.balance = +r.headers.get("x-balance"); S.total = +r.headers.get("x-total") || S.total; }
      try{ S.freeTests = JSON.parse(r.headers.get("x-free-tests")) || S.freeTests; }catch(e){}
      m.status="ready";
      S.expr = "neutral"; // each new voice over starts from the normal expression again
    } else fail = (await r.text()).trim();
  }catch(err){ fail="offline"; }
  if(fail){
    c.msgs.splice(c.msgs.indexOf(m),1);
    if(fail==="login_again") sessionEnded();
    else if(fail==="low_balance"){ await loadMe(); openPlans(t("lowBal", fmt(S.balance), fmt(sec))); }
    else toast(t(fail==="trial_cap" ? "trialCap" : fail==="offline" ? "e_offline" : "genFail"));
  }
  renderIdeas(); renderAll(); save();
}

/* ---------- auto-expression: one tag per sentence ----------
   Works offline with simple Kiswahili + English keyword rules, so the user sees and can edit the tags.
   If ElevenLabs gives API access to its own "Enhance" feature, replace pickTag/autoTag with a call to the server. */
const TAG_RULES = [
  [/\b(samahani|pole|kwa masikitiko|tunasikitika|msiba|rambirambi|sorry|unfortunately|sadly|condolences|passed away)\b/, "sad"],
  [/\b(haikubaliki|marufuku|nimechoka|inatosha|unacceptable|furious|outrageous|enough is enough)\b/, "angry"],
  [/\b(kimya kimya|kwa siri|nong'ona|quietly|between us|whisper)\b/, "whispers"],
  [/\b(haha|utani|mzaha|kuchekesha|vichekesho|funny|joke|lol)\b/, "playful"],
  [/\b(habari njema|punguzo|ofa|bure|bonasi|zawadi|leo tu|wiki hii tu|haraka|mpya|good news|discount|offer|free|bonus|today only|hurry|limited|brand new|amazing)\b/, "excited"],
  [/\b(muhimu|onyo|tahadhari|zingatia|kumbuka|important|warning|attention|remember|note that)\b/, "serious"],
  [/\b(hapo zamani|zamani za kale|siku moja|once upon a time|long ago|one day)\b/, "calm"],
  [/\b(karibu|karibuni|asante|ahsante|hongera|tafadhali|welcome|thank you|thanks|congratulations|please)\b/, "warm"],
];
function pickTag(sentence, fallback){
  const l = sentence.toLowerCase();
  for(const [re, tag] of TAG_RULES) if(re.test(l)) return tag;
  if(/!\s*$/.test(sentence)) return "excited";
  if(/\?\s*$/.test(sentence)) return "curious";
  return fallback || "warm";
}
function autoTag(text){
  const fallback = exprOf(S.expr).tag;
  return stripTags(text).trim().replace(/[^.!?…\n]+[.!?…]*/g, s=>{
    const body = s.trim(); if(!body) return s;
    return s.match(/^\s*/)[0] + `[${pickTag(body, fallback)}] ` + body;
  });
}
// The AI (Gemini, on the server) reads the whole script and picks an expression for every sentence.
// If it cannot be reached, the simple keyword rules above are used instead.
const SENTENCE_RE = /[^.!?…\n]+[.!?…]*/g;
$("autoBtn").onclick = async ()=>{
  const plain = stripTags(input.value).trim();
  if(!plain) return;
  const btn = $("autoBtn"); btn.disabled = true; toast(t("autoWait"));
  const parts = plain.match(SENTENCE_RE).map(s=>s.trim());
  let tags = null;
  try{
    const r = await api("/expressions", { sentences:parts, lang:S.lang });
    if(r.status===401){ btn.disabled = false; return sessionEnded(); }
    if(r.ok) tags = (await r.json()).tags;
  }catch(e){}
  if(Array.isArray(tags) && tags.length===parts.length){
    let i = 0;
    input.value = plain.replace(SENTENCE_RE, s=>{
      const tag = tags[i++], body = s.trim();
      return body ? s.match(/^\s*/)[0] + (tag && tag!=="neutral" ? `[${tag}] ` : "") + body : s;
    });
    toast(t("autoDone"));
  } else { input.value = autoTag(input.value); toast(t("autoFail")); }
  onInput(); input.focus();
};

/* ---------- playback ---------- */
let playing = null; // {id, el, audio, timer}
const playEl = p => p.el.isConnected ? p.el : (p.el = document.querySelector(`.a[data-id="${p.id}"]`) || p.el); // the list is redrawn now and then: find the card again
function stopPlay(){
  if(!playing) return;
  if(playing.audio) playing.audio.pause();
  clearInterval(playing.timer);
  const el=playEl(playing); if(el && el.isConnected){ el.classList.remove("playing"); el.querySelector("[data-act=play]").innerHTML=PLAY; el.querySelectorAll("[data-wave] i").forEach(i=>i.classList.remove("on")); el.querySelector("[data-dur]").textContent=fmt(playing.sec); el.querySelector("[data-wave]").setAttribute("aria-valuenow",0); }
  playing=null;
}
// Draws the progress of the voice over that is playing: the bars, the time left, the pause button and the dancing logo.
function paintPlay(){
  const p=playing; if(!p) return;
  const el=playEl(p); if(!el.isConnected) return;
  const a=p.audio, dur=dur_(a,p.sec), bars=el.querySelectorAll("[data-wave] i"), k=Math.floor(Math.min(1,a.currentTime/dur)*bars.length);
  bars.forEach((b,i)=>b.classList.toggle("on",i<k));
  el.querySelector("[data-dur]").textContent=fmt(dur-a.currentTime);
  el.querySelector("[data-wave]").setAttribute("aria-valuenow", Math.round(a.currentTime/dur*100));
  const btn=el.querySelector("[data-act=play]"), state=a.paused?"play":"pause";
  if(btn.dataset.s!==state){ btn.dataset.s=state; btn.innerHTML=a.paused?PLAY:PAUSE; }
  el.classList.toggle("playing", !a.paused); // the SautiPlus logo above the voice over moves only while the sound is playing
}
const dur_ = (a,fallback) => isFinite(a.duration) && a.duration>0 ? a.duration : fallback;
const PLAY = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>`;
const PAUSE = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>`;
// from = where to start, 0 to 1 (when the user dragged or tapped the wave of a voice over that was not playing)
let playTok = 0; // newest request wins, so dragging on a voice over that is still loading does not start it twice
async function play(el, m, from){
  if(from===undefined && playing && playing.id===m.id){ stopPlay(); return; }
  stopPlay(); stopSample();
  const tok = ++playTok;
  const url = await audioUrl(m);
  if(tok!==playTok) return;
  if(!url){ toast(t("noAudio")); return; }
  const a=new Audio(url);
  playing={ id:m.id, el, audio:a, sec:m.sec };
  if(from) a.addEventListener("loadedmetadata", ()=>{ a.currentTime = from * dur_(a, m.sec); }, { once:true });
  const done=()=>{ if(playing&&playing.id===m.id) stopPlay(); };
  a.onended=done; a.play().catch(done);
  paintPlay();
  playing.timer=setInterval(paintPlay,100);
}
// Moving through the voice over: tap or drag on the wave, or use the left and right arrow keys.
function seekTo(el, m, ratio){
  ratio = Math.min(1, Math.max(0, ratio));
  if(!playing || playing.id!==m.id){ play(el, m, ratio); return; }
  const a=playing.audio;
  a.currentTime = ratio * dur_(a, m.sec);
  if(a.paused) a.play().catch(()=>{});
  paintPlay();
}
(()=>{
  const box=$("msgs"); let drag=null;
  const msgOf = el => curChat()?.msgs.find(x=>x.id===el.dataset.id);
  const ratio = (wave,e) => { const r=wave.getBoundingClientRect(); return (e.clientX-r.left)/r.width; };
  box.addEventListener("pointerdown", e=>{
    const wave=e.target.closest("[data-wave]"); if(!wave || e.button>0) return;
    const el=wave.closest(".a"), m=msgOf(el); if(!m) return;
    drag={ wave, el, m, id:e.pointerId };
    try{ wave.setPointerCapture(e.pointerId); }catch(err){}
    seekTo(el, m, ratio(wave,e));
  });
  box.addEventListener("pointermove", e=>{ if(drag && e.pointerId===drag.id) seekTo(drag.el, drag.m, ratio(drag.wave,e)); });
  ["pointerup","pointercancel","lostpointercapture"].forEach(n=>box.addEventListener(n, e=>{ if(drag && e.pointerId===drag.id) drag=null; }));
  box.addEventListener("keydown", e=>{
    const wave=e.target.closest("[data-wave]"); if(!wave || !["ArrowLeft","ArrowRight"].includes(e.key)) return;
    const el=wave.closest(".a"), m=msgOf(el); if(!m) return;
    e.preventDefault();
    const a = playing && playing.id===m.id ? playing.audio : null, d = a ? dur_(a, m.sec) : m.sec;
    seekTo(el, m, ((a ? a.currentTime : 0) + (e.key==="ArrowRight" ? 5 : -5)) / d);
  });
})();
// Voice samples are small MP3 files that ship with the app (samples/<voice>.mp3).
let sample = null; // {id, audio}
const MINI_PLAY = PLAY.replace('width="18" height="18"','width="14" height="14"');

function playSample(id){

  stopSample(); if(same) return;
  stopPlay();
  const audio = new Audio(`samples/${id}.mp3`);
  sample = { id, audio };

// Browser: download the MP3. Android app: open the share sheet (WhatsApp, save to files, …).
async function saveAudio(m){
  const url = await audioUrl(m);
  if(!url){ toast(t("noAudio")); return; }
  const name = `sautiplus-${voiceOf(m.voice).name.replace(/\s+/g,"-")}-${m.id}.mp3`;
  const P = NATIVE ? window.Capacitor.Plugins : null;
  if(P?.Filesystem && P?.Share){
    try{
      const blob = await (await fetch(url)).blob();
      const b64 = await new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result.split(",")[1]); fr.readAsDataURL(blob); });
      const f = await P.Filesystem.writeFile({ path:name, data:b64, directory:"CACHE" });
      await P.Share.share({ title:"SautiPlus AI", files:[f.uri] });
    }catch(e){} // closing the share sheet without choosing is not an error
    return;
  }
  const a=document.createElement("a"); a.href=url; a.download=name; a.click();
}
// Copies text. Falls back to a hidden text box where the clipboard API is not allowed (older WebViews, plain http).
async function copyText(s){
  try{ await navigator.clipboard.writeText(s); toast(t("copied")); return; }catch(e){}
  try{
    const ta=document.createElement("textarea"); ta.value=s; ta.style.cssText="position:fixed;opacity:0"; document.body.appendChild(ta); ta.select();
    const ok=document.execCommand("copy"); ta.remove(); toast(t(ok ? "copied" : "copyFail"));
  }catch(e){ toast(t("copyFail")); }
}

/* ---------- press and hold a message to delete it ----------
   Works on the user's own scripts and on finished voice overs. On a computer, right-click does the same. */
let delIndex = -1; // position (in the open conversation) of the message the user is about to delete
function askDelete(el){
  const c = curChat(); if(!c) return;
  delIndex = el.matches(".u") ? +el.dataset.i : c.msgs.findIndex(m=>m.id===el.dataset.id);
  const m = c.msgs[delIndex]; if(!m) return;
  el.classList.add("held");
  $("delWhat").textContent = m.role==="user" ? `${t("delScript")}: "${m.text.length > 90 ? m.text.slice(0, 90)+"…" : m.text}"` : t("delAudio", voiceOf(m.voice).name, fmt(m.sec));
  openSheet("delSheet");
}
$("delGo").onclick = ()=>{
  const c = curChat(), m = c && c.msgs[delIndex];
  closeAll();
  if(!m) return;
  if(m.role==="voice"){
    if(playing && playing.id===m.id) stopPlay();
    if(audioCache[m.id]){ URL.revokeObjectURL(audioCache[m.id]); delete audioCache[m.id]; }
    audioStore.del(m.id);
  }
  c.msgs.splice(delIndex, 1);
  if(!c.msgs.length){ // an empty conversation is removed from the history
    S.chats = S.chats.filter(x=>x!==c); S.cur = null;
    if(S.user?.token && S.synced[c.id]){ S.delQ.push(c.id); delete S.synced[c.id]; flushDeletes(); }
  }
  save(); renderAll(); toast(t("deleted"));
};
(()=>{
  const box = $("msgs"), HOLD = 550;
  let timer = null, x0 = 0, y0 = 0, held = false, heldAt = 0;
  const item = e => e.target.closest("[data-wave]") ? null : e.target.closest(".u, .a[data-id]"); // holding the wave is for moving through the audio, not deleting
  const cancel = ()=>{ clearTimeout(timer); timer = null; };
  box.addEventListener("pointerdown", e=>{
    const el = item(e); held = false; cancel();
    if(!el || e.button > 0) return;
    x0 = e.clientX; y0 = e.clientY;
    timer = setTimeout(()=>{ timer = null; held = true; heldAt = Date.now(); askDelete(el); }, HOLD);
  });
  box.addEventListener("pointermove", e=>{ if(timer && Math.hypot(e.clientX-x0, e.clientY-y0) > 10) cancel(); }); // the finger moved: it's a scroll
  ["pointerup","pointercancel","pointerleave"].forEach(n=>box.addEventListener(n, cancel));
  $("scroll").addEventListener("scroll", cancel, { passive:true });
  box.addEventListener("contextmenu", e=>{ const el = item(e); if(!el) return; e.preventDefault(); cancel(); if(Date.now()-heldAt > 1000) askDelete(el); }); // phones also fire this at the end of a hold: once is enough
  // lifting the finger after a hold must not also press Play or Download underneath
  box.addEventListener("click", e=>{ if(held){ held = false; e.stopPropagation(); e.preventDefault(); } }, true);
})();

/* ---------- pull down to refresh ----------
   Dragging the conversation down from the top reloads the app: fresh balance, notifications and any new version.
   While a voice over is being made, only the account is refreshed so the audio is not lost. */
(()=>{
  const sc = $("scroll"), ptr = $("ptr"), NEED = 70;
  let y0 = null, pull = 0, busy = false;
  const show = px => { ptr.style.transform = `translate(-50%, ${Math.min(px, 96) - 70}px) rotate(${px*3}deg)`; ptr.style.opacity = Math.min(1, px/40); ptr.classList.toggle("ready", px >= NEED); };
  const hide = () => { ptr.classList.add("back"); ptr.classList.remove("ready","spin"); ptr.style.transform = ""; ptr.style.opacity = ""; };
  sc.addEventListener("touchstart", e=>{ y0 = !busy && sc.scrollTop <= 0 && e.touches.length === 1 ? e.touches[0].clientY : null; pull = 0; ptr.classList.remove("back"); }, { passive:true });
  sc.addEventListener("touchmove", e=>{
    if(y0 === null) return;
    if(sc.scrollTop > 0){ y0 = null; hide(); return; }
    pull = Math.max(0, (e.touches[0].clientY - y0) * .5);
    show(pull);
  }, { passive:true });
  const end = async ()=>{
    if(y0 === null) return;
    y0 = null;
    if(pull < NEED){ hide(); return; }
    busy = true; ptr.classList.add("back","spin"); ptr.style.transform = "translate(-50%, 0)";
    if(document.querySelector(".a.gen")){ await loadMe(); busy = false; hide(); return; }
    try{ sessionStorage.setItem("sautiplus-draft", input.value); }catch(e){}
    location.reload();
  };
  sc.addEventListener("touchend", end); sc.addEventListener("touchcancel", end);
})();

async function openRecorder(){

  micOff = false; setRecLang("sw");

  if(NATIVE){
    const build = parseInt((await window.Capacitor.Plugins.App.getInfo().catch(()=>({}))).build, 10) || 0;

$("recBtn").onclick = async ()=>{
  if(rec && rec.mr && rec.mr.state === "recording"){ recStop(); return; }
  $("recErr").textContent = ""; $("recAudio").hidden = true; stopPlay(); stopSample();
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true } }); }
  catch(e){ $("recErr").textContent = t("recNoMic"); return; }
  const type = ["audio/webm;codecs=opus","audio/webm","audio/mp4"].find(m=>window.MediaRecorder && MediaRecorder.isTypeSupported(m));
  const mr = new MediaRecorder(stream, type ? { mimeType:type } : undefined), chunks = [], t0 = Date.now();
  const me = rec = { stream, mr, blob:null, secs:0, timer:setInterval(()=>{
    me.secs = (Date.now()-t0)/1000; recUI("going", me.secs);
    if(me.secs >= REC_MAX) recStop();
  }, 250) };
  mr.ondataavailable = e=>{ if(e.data.size) chunks.push(e.data); };
  mr.onstop = ()=>{
    if(rec !== me) return; // the sheet was closed or a new recording started
    me.secs = (Date.now()-t0)/1000;
    me.blob = new Blob(chunks, { type: mr.mimeType || type || "audio/webm" });
    $("recAudio").src = URL.createObjectURL(me.blob); $("recAudio").hidden = false;
    recUI(me.secs < REC_MIN ? "short" : "ready", me.secs);
  };
  mr.start(); recUI("going", 0);
};
// Instead of recording, the user can pick an audio file of their voice (a voice note, a studio recording…).
$("recUpload").onclick = ()=>$("recFile").click();
$("recFile").onchange = async e=>{
  const file = e.target.files[0]; e.target.value = "";
  if(!file) return;
  recStop(); rec = null; $("recErr").textContent = ""; $("recAudio").hidden = true;
  const audioFile = /^(audio|video)\//.test(file.type) || /\.(mp3|wav|m4a|aac|ogg|oga|opus|webm|flac|mp4)$/i.test(file.name);
  if(!audioFile){ $("recErr").textContent = t("recBadFile"); recUI("idle", 0); return; }
  if(file.size > REC_MAX_BYTES){ $("recErr").textContent = t("recTooBig"); recUI("idle", 0); return; }
  const url = URL.createObjectURL(file);
  // how long is it? If this phone can't read the format, let the server decide.
  const secs = await new Promise(ok=>{ const a = new Audio(); a.preload = "metadata"; a.onloadedmetadata = ()=>ok(isFinite(a.duration) && a.duration > 0 ? a.duration : REC_MIN); a.onerror = ()=>ok(REC_MIN); setTimeout(()=>ok(REC_MIN), 4000); a.src = url; });
  rec = { blob:file, file:file.name, secs };
  $("recAudio").src = url; $("recAudio").hidden = false;
  recUI(secs < REC_MIN ? "short" : "ready", secs);
};
$("recSend").onclick = async ()=>{
  const name = $("recName").value.trim();
  if(!name){ $("recErr").textContent = t("recNeedName"); $("recName").focus(); return; }
  if(!rec || !rec.blob) return;
  $("recErr").textContent = ""; recUI("sending", rec.secs);
  try{
    const audio = await new Promise((ok, no)=>{ const fr = new FileReader(); fr.onload = ()=>ok(String(fr.result).split(",")[1]); fr.onerror = no; fr.readAsDataURL(rec.blob); });
    const r = await api("/clone", { name, audio, mime:rec.blob.type, file:rec.file || "" });
    if(r.status === 401) return sessionEnded();
    if(!r.ok){
      const code = (await r.text()).trim();
      $("recErr").textContent = code==="clone_full" ? t("cloneFull") : code==="clone_limit" ? t("cloneLimit", cloneSlots()) : code==="clone_plan" ? t("cloneNeedPlan") : code==="clone_short" ? t("recShort", REC_MIN) : t("cloneFail");
      recUI("ready", rec.secs); return;
    }
    const c = await r.json();
    S.clones.push({ id:c.id, name:c.name, share:"none" }); S.voice = "clone:"+c.id; save();
    closeAll(); renderVoice(); toast(t("cloneDone", c.name));
  }catch(e){ $("recErr").textContent = t("e_offline"); recUI("ready", rec ? rec.secs : 0); }
};

async function shareClone(id, name, cur){

// Full number with country code, e.g. +255712345678 — or null if it doesn't look right.
function fullPhone(){
  const raw=$("aPhone").value.trim();
  const dial=COUNTRIES.find(x=>x[0]===$("aCountry").value)[1];
  const full = raw.startsWith("+") ? "+"+raw.replace(/\D/g,"") : "+"+dial+raw.replace(/\D/g,"").replace(/^0+/,"");
  if(full.startsWith("+255")) return /^\+255[67]\d{8}$/.test(full) ? full : null;
  return /^\+\d{7,15}$/.test(full) && full.length-1-dial.length>=4 ? full : null;

  if(m==="signup") checks.push(["aName", fieldErr("aName","eName", name ? "" : t("badName"))]);
  if(m!=="reset") checks.push(["aEmail", fieldErr("aEmail","eEmail", /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) ? "" : t("badEmail"))]);
  if(m==="signup") checks.push(["aPhone", fieldErr("aPhone","ePhone", phone ? "" : t("badPhoneIntl"))]);
  if(m==="signup"||m==="reset") checks.push(["aPass", fieldErr("aPass","ePass", password.length>=8 ? "" : t("e_bad_password"))]);
  if(m==="signup") checks.push(["aTerms", fieldErr("aTerms","eTerms", $("aTerms").checked ? "" : t("needTerms"))]);
  if(m==="login") checks.push(["aPass", fieldErr("aPass","ePass", password ? "" : t("needPassword"))]);
  const bad = checks.find(c=>!c[1]); if(bad){ $(bad[0]).focus(); return; }

  const btn=$("authGo"); btn.disabled=true;
  try{
    const body = { signup:{ name, email, phone, password, lang:S.lang, terms:true }, login:{ email, password }, forgot:{ email, from: NATIVE ? "app" : "web" }, reset:{ accessToken:resetKey, password } }[m];
    const r = await fetch(CONFIG.API+"/"+m, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(body) });
    if(r.ok){
      if(m==="forgot"){ $("authOk").textContent=t("forgotSent"); $("authOk").hidden=false; }
      else { if(m==="reset") resetKey=null; loggedIn(await r.json()); if(m==="reset") toast(t("resetDone")); }
    } else {
      const code=(await r.text()).trim(), msg=T[S.lang]["e_"+code] || t("e_offline");
      const where={ email_taken:["aEmail","eEmail"], bad_email:["aEmail","eEmail"], phone_taken:["aPhone","ePhone"], bad_phone:["aPhone","ePhone"], bad_password:["aPass","ePass"] }[code];
      if(where){ fieldErr(where[0], where[1], msg); $(where[0]).focus(); } else $("eForm").textContent=msg;
    }
  }catch(err){ $("eForm").textContent=t("e_offline"); }
  btn.disabled=false;
});
function sessionEnded(){ S.user=null; save(); showAuth("login"); $("eForm").textContent=t("sessionEnded"); }

/* ---------- account refresh: balance, package and notifications from the server ---------- */
let NOTIFS = [];
async function loadMe(){
  if(!S.user?.token) return;
  try{
    const r = await api("/me");
    if(r.status===401) return sessionEnded(); // logged in on another phone since, so this one must log in again
    if(!r.ok) return;
    const p = await r.json(), list = p.notifications || [];
    if(NOTIFS.length && list.length && list[0].id > NOTIFS[0].id) toast(list[0].title); // arrived while the app was open
    const approved = S.pendingPlan && !p.pendingPlan && p.balance > S.balance;
    NOTIFS = list;
    Object.assign(S.user, { name:p.name, isAdmin:p.isAdmin });
    Object.assign(S, { balance:p.balance, total:p.total, planId:p.planId, freeTests:p.freeTests || [], pendingPlan:p.pendingPlan, unlimited:!!p.unlimited, clones:p.clones || [], publicVoices:p.publicVoices || [] });
    S.user.phone = p.phone || S.user.phone;
    S.voice = voiceOf(S.voice).id; renderVoice(); // a cloned voice deleted on another device falls back to Baraka
    autoLang();
    save(); renderBell(); renderBal(); renderIdeas(); renderMe();
    pullChats(); // the history made on the user's other devices
    if(approved) toast(t("paidOk"));
  }catch(e){}
}
function renderBell(){
  const unread = NOTIFS.filter(x=>x.id > S.notifSeen).length;
  $("bellBadge").hidden = !unread; $("bellBadge").textContent = unread > 9 ? "9+" : unread;
}
function openNotifs(){
  const fmtD = d => new Date(d).toLocaleString(S.lang==="sw"?"sw-TZ":"en-GB",{dateStyle:"medium",timeStyle:"short"});
  $("notifList").innerHTML = NOTIFS.length ? NOTIFS.map(x=>`<div class="nt ${x.id>S.notifSeen?"new":""}"><b>${esc(x.title)}</b><p>${esc(x.body)}</p><span>${fmtD(x.created_at)}</span></div>`).join("")
    : `<p class="sub">${t("noNotifs")}</p>`;
  openSheet("notifSheet");
  if(NOTIFS.length){ S.notifSeen = NOTIFS[0].id; save(); renderBell(); }
}
$("bellBtn").onclick = openNotifs;
setInterval(loadMe, CONFIG.REFRESH_EVERY_MS);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) loadMe(); });

/* ---------- start ---------- */
applyLang(); renderIdeas(); renderAll(); loadRates();
// The link in a "forgot password" email ends with #access_token=…&type=recovery.
// In a browser it opens this page; on Android it opens the app (sautiplus://reset#…).
function handleLink(url){
  const h = new URLSearchParams(String(url).split("#")[1] || "");
  if(h.get("type")==="recovery" && h.get("access_token")){ resetKey=h.get("access_token"); S.user=null; save(); showAuth("reset"); return true; }
  if(h.get("error_code") || h.get("error")){ S.user=null; save(); showAuth("forgot"); $("eForm").textContent=t("e_link_expired"); return true; }
  return false;
}
if(handleLink(location.href)) history.replaceState(null, "", location.pathname);
else if(!S.user?.token){ S.user=null; showAuth(S.chats.length ? "login" : "signup"); }
else loadMe();

if(NATIVE){
  const App = window.Capacitor.Plugins.App;
  App.addListener("appUrlOpen", e=>handleLink(e.url));
  App.getLaunchUrl().then(r=>{ if(r?.url) handleLink(r.url); }).catch(()=>{});
  // Android back button: close whatever is open first, leave the app only from the main screen
  App.addListener("backButton", ()=>{
    if(!$("updateScreen").hidden) App.minimizeApp();
    else if(document.querySelector(".sheet.show, .drawer.show")) closeAll();
    else if(!$("auth").hidden && authMode!=="signup" && authMode!=="login") showAuth("login");
    else App.minimizeApp();
  });

  /* ---------- updates ----------
     The website's app/version.json says which version is current.
     - Live update: newer screens (this file, photos, clips) are downloaded in the background and used from the next start.
     - Update required: if this APK is older than "minApk", a full screen asks the user to download the new APK. */
  const Up = window.Capacitor.Plugins.CapacitorUpdater;
  // Tells the updater these screens started fine. Without this call it goes back to the previous screens by itself.
  Up?.notifyAppReady().catch(()=>{});
  const newer = (a,b)=>{ const x=String(a).split(".").map(Number), y=String(b).split(".").map(Number); for(let i=0;i<3;i++){ const d=(x[i]||0)-(y[i]||0); if(d) return d>0; } return false; };
  const busy = ()=> !!(input.value.trim() || playing || sample || document.querySelector(".a.gen, .sheet.show"));
  let lastCheck = 0, apkUrl = SITE + "/";
  $("updBtn").onclick = ()=> window.open(apkUrl, "_blank");
  async function checkUpdates(){
    if(Date.now()-lastCheck < 10*60000) return;
    lastCheck = Date.now();
    try{
      const v = await (await fetch(`${SITE}/app/version.json?t=${Date.now()}`, { cache:"no-store" })).json();
      const build = parseInt((await App.getInfo()).build, 10) || 0;
      if(build < v.minApk){ apkUrl = v.apkUrl; stopPlay(); stopSample(); $("updateScreen").hidden = false; return; }
      // one try per version: if new screens ever fail to start, the phone keeps the old ones instead of looping
      if(!Up || !newer(v.web, WEB_VERSION) || localStorage.getItem("sautiplus-tried") === v.web) return;
      const b = await Up.download({ url: v.bundleUrl, version: v.web, checksum: v.checksum });
      await Up.next({ id: b.id });
      localStorage.setItem("sautiplus-tried", v.web);
      if(!busy()) await Up.reload();
    }catch(e){ lastCheck = 0; }
  }
  checkUpdates();
  App.addListener("appStateChange", s=>{ if(s.isActive) checkUpdates(); });
}
</script>
